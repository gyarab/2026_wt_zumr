<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Clicker Game</h1>
    
        <h2>Your Score:
             <span id="score">0</span>
        </h2>

        <button onclick="addCnt()">Click Me!</button> 
        <button onclick="resetCnt()">Reset</button>
</body>
<script>
    console.log("Starting Clicker Game");
    let count = 0;
    function updateCnt() {
        const el= document.getElementById("score");
        el.innerHTML = count;
    }

    updateCnt();

    function addCnt() {
        console.log("Adding to count");
        count++;
        updateCnt();
    }

    function resetCnt() {
        console.log("Resetting count");
        count = 0;
        updateCnt();
    }
</script>
</html>
